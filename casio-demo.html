<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASIO Scientific Calculator Component — 1:1 Hardware Clone</title>
  <link rel="stylesheet" href="./assets/CasioCalculator.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    header {
      margin-bottom: 14px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    p {
      font-size: 13.5px;
      color: #94a3b8;
    }
    .demo-controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .demo-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .demo-btn:hover { background: #3b82f6; border-color: #3b82f6; }
    #calc-mount {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CASIO ClassWiz fx-880BTG & fx-580VN X — Giả lập phần cứng 1:1</h1>
    <p>Bấm nút <b>HOME</b> (hoặc <b>MENU</b>) để mở Menu dạng icon chuẩn ma trận điểm Casio</p>
  </header>

  <div id="calc-mount"></div>

  <div class="demo-controls">
    <button class="demo-btn" id="btnSwitch880">📱 Casio fx-880BTG</button>
    <button class="demo-btn" id="btnSwitch580">📟 Casio fx-580VN X</button>
    <button class="demo-btn" id="btnOpenMenu">📋 Mở Menu Icon</button>
  </div>

  <script type="module">
    import { CasioCalculator } from './assets/CasioCalculator.js';
    const calc = new CasioCalculator('#calc-mount', {
      model: 'fx880',
      angleMode: 'deg',
      digits: 10,
      onResult: (res) => {
        console.log('Casio Result:', res);
      }
    });

    document.getElementById('btnSwitch880').addEventListener('click', () => calc.setModel('fx880'));
    document.getElementById('btnSwitch580').addEventListener('click', () => calc.setModel('fx580'));
    document.getElementById('btnOpenMenu').addEventListener('click', () => calc.openMenu());
  </script>
</body>
</html>
