<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASIO Scientific Calculator Component — Demo</title>
  <link rel="stylesheet" href="./assets/CasioCalculator.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      color: #60a5fa;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
    }
    #calc-mount {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bộ giả lập máy tính khoa học CASIO chuẩn Sư phạm</h1>
    <p>Hỗ trợ đầy đủ dòng Casio fx-580VN X (ClassWiz) & Casio fx-880BTG</p>
  </header>

  <div id="calc-mount"></div>

  <script type="module">
    import { CasioCalculator } from './assets/CasioCalculator.js';
    const calc = new CasioCalculator('#calc-mount', {
      model: 'fx580',
      angleMode: 'deg',
      digits: 10,
      onResult: (res) => {
        console.log('Casio Result:', res);
      }
    });
  </script>
</body>
</html>
