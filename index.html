<script>
// 1. Tự động dọn sạch mã theo dõi fbclid trên thanh địa chỉ nếu có
if (location.search.includes('fbclid=')) {
  try {
    var u = new URL(location.href);
    u.searchParams.delete('fbclid');
    window.history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
  } catch (_) {}
}
// 2. Bắt ngay sự kiện beforeinstallprompt ở thẻ <head> trước khi các module JS lớn được nạp,
// tránh việc Chromium / Edge tự tiêu thụ sự kiện và không kích hoạt được hộp thoại cài đặt qua nút.
window.__deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.__deferredPrompt = e;
  window.dispatchEvent(new CustomEvent('pwa-deferred-ready'));
});
</script>
